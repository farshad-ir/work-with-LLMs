<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCode Gateway</title>
  <style>
    body {
      margin: 0;
      background: #f3f5f9;
      color: #202938;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }
    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 12px 0;
      border-radius: 14px;
      box-shadow: 0 4px 18px #1720330c;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }
    .count {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0;
    }
    .muted {
      color: #64748b;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .message {
      min-height: 24px;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main>
  <h1>MyCode Gateway</h1>
  <p>پنل مدیریت اتصال به مدل‌های هوش مصنوعی</p>

  <section class="card">
    <span class="badge">سرویس فعال است</span>
    <h2>ارائه‌دهندگان مدل</h2>
    <p id="status">در حال دریافت اطلاعات...</p>
    <div class="providers" id="providers"></div>
  </section>

  <section class="card">

    <h2>مدل‌ها</h2>

    <p id="rotation-round">
        شماره دور: —
    </p>

    <p id="rotation-count">
        تعداد مدل‌های باقی‌مانده: —
    </p>

    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="text-align: left; padding: 8px;">Row</th>
                    <th style="text-align: left; padding: 8px;">Model Name</th>
                    <th style="text-align: left; padding: 8px;">Interface</th>
                </tr>
            </thead>

            <tbody id="rotation-models-body">
                <tr>
                    <td colspan="3" style="padding: 8px;">
                        در حال بارگذاری مدل‌ها...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

  </section>



</main>


<script>
const providerNames = {
  nvidia: "NVIDIA NIM",
  openrouter: "OpenRouter",
  token_router: "Token Router"
};

async function loadProviders() {
  const status = document.getElementById("status");
  const container = document.getElementById("providers");

  try {
    const response = await fetch("/api/providers");
    if (!response.ok) throw new Error("HTTP " + response.status);

    const providers = await response.json();
    container.replaceChildren();

    for (const [key, provider] of Object.entries(providers)) {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = providerNames[key] || key;

      const state = document.createElement("p");
      state.textContent = provider.enabled ? "فعال" : "غیرفعال";

      const count = document.createElement("div");
      count.className = "count";
      count.textContent = provider.model_count ?? 0;

      const label = document.createElement("p");
      label.textContent = "مدل ثبت‌شده";

      const button = document.createElement("button");
      button.textContent = "دریافت مدل‌ها";

      const message = document.createElement("div");
      message.className = "message muted";

      button.addEventListener("click", async () => {
        button.disabled = true;
        message.textContent = "در حال دریافت فهرست مدل‌ها...";

        try {
          const result = await fetch(
            `/api/providers/${encodeURIComponent(key)}/refresh-models`,
            { method: "POST" }
          );

          const data = await result.json();

          if (!result.ok) {
            throw new Error(data.detail || "خطای نامشخص");
          }

          count.textContent = data.model_count;
          state.textContent = "فعال";
          message.textContent =
            `${data.model_count} مدل با موفقیت دریافت شد.`;
        } catch (error) {
          message.textContent = "خطا: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

      card.append(title, state, count, label, button, message);
      container.appendChild(card);
    }

    status.textContent = "اطلاعات با موفقیت دریافت شد.";
  } catch (error) {
    status.textContent = "دریافت اطلاعات ناموفق بود: " + error.message;
  }
}

loadProviders();



let largeCatalogModels = [];

async function loadLargeCatalog() {
    const countElement = document.getElementById("large-catalog-count");
    const statusElement = document.getElementById("large-catalog-status");

    try {
        const response = await fetch("/api/thinker-room/catalog");

        if (!response.ok) {
            throw new Error("خطا در دریافت دفتر بزرگ");
        }

        const catalog = await response.json();

        largeCatalogModels = catalog.models || [];

        countElement.textContent = catalog.model_count ?? largeCatalogModels.length;

        statusElement.textContent = catalog.updated_at
            ? "آخرین به‌روزرسانی: " +
              new Date(catalog.updated_at).toLocaleString()
            : "دفتر بزرگ هنوز ساخته نشده است.";

        renderLargeCatalog();
        renderRotationPanel();
      
    } catch (error) {
        statusElement.textContent = error.message;
    }
}

function renderLargeCatalog() {
    const listElement = document.getElementById("large-catalog-list");
    const searchElement = document.getElementById("large-catalog-search");
    const query = searchElement.value.trim().toLowerCase();

    // مرتب‌سازی فقط برای نمایش است و اطلاعات ذخیره‌شده را تغییر نمی‌دهد.
    const sorted = [...largeCatalogModels].sort((a, b) => {
        const charsA = Number(a.lifetime_chars) || 0;
        const charsB = Number(b.lifetime_chars) || 0;

        return charsB - charsA;
    });

    const filtered = sorted.filter(model =>
        `${model.provider || ""} ${model.id || ""} ${model.name || ""}`
            .toLowerCase()
            .includes(query)
    );

    listElement.replaceChildren();

    if (filtered.length === 0) {
        listElement.textContent = "مدلی برای نمایش وجود ندارد.";
        return;
    }

    const fragment = document.createDocumentFragment();

    for (const model of filtered) {
        const row = document.createElement("div");

        row.style.cssText = [
            "padding:12px 0",
            "border-bottom:1px solid #ddd",
            "overflow-wrap:anywhere"
        ].join(";");

        const title = document.createElement("strong");
        title.textContent = model.name || model.id || "مدل بدون نام";

        const details = document.createElement("div");
        details.className = "muted";
        details.textContent =
            `${providerNames[model.provider] || model.provider || "نامشخص"} — ${model.id || ""}`;

        const chars = document.createElement("div");
        const lifetimeChars = Number(model.lifetime_chars) || 0;
        chars.textContent =
            `کاراکترهای ورودی موفق: ${lifetimeChars.toLocaleString()}`;

        const requests = document.createElement("div");
        requests.className = "muted";
        requests.textContent =
            `درخواست موفق: ${Number(model.successful_requests) || 0} | ` +
            `درخواست ناموفق: ${Number(model.failed_requests) || 0}`;

        const status = document.createElement("div");
        status.className = "muted";

        const testStatus = model.test_status || model.status || "untested";

        const statusNames = {
            tested: "آزمایش‌شده",
            completed: "آزمایش‌شده",
            in_progress: "در حال آزمایش",
            testing: "در حال آزمایش",
            failed: "ناموفق",
            untested: "آزمایش‌نشده",
            pending: "آزمایش‌نشده"
        };

        status.textContent =
            `وضعیت: ${statusNames[testStatus] || testStatus}`;

        row.append(title, details, chars, requests, status);
        fragment.appendChild(row);
    }

    listElement.appendChild(fragment);
}

document
    .getElementById("large-catalog-search")
    .addEventListener("input", renderLargeCatalog);

loadLargeCatalog();


//new  
function getModelStatus(model) {
    const current = model.test_status ?? "untested";

    if (current === "failed") {
        return "failed";
    }

    if (
        current === "tested" ||
        model.lifetime_chars != null
    ) {
        return "tested";
    }

    if (current === "in_progress") {
        return "in_progress";
    }

    return "untested";
}

function renderRotationPanel() {
    const roundElement =
        document.getElementById("rotation-round");

    const countElement =
        document.getElementById("rotation-count");

    const tableBody =
        document.getElementById("rotation-models-body");

    if (!roundElement || !countElement || !tableBody) {
        return;
    }

    const successfulModels = largeCatalogModels.filter(
        model => getModelStatus(model) === "tested"
    );

    const remainingCount = largeCatalogModels.filter(
        model => getModelStatus(model) === "untested"
    ).length;

    roundElement.textContent = "شماره دور: —";

    countElement.textContent =
        `تعداد مدل‌های باقی‌مانده: ${
            remainingCount.toLocaleString("fa-IR")
        }`;

    if (successfulModels.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="3" style="padding: 8px;">
                    هنوز مدل موفقی ثبت نشده است.
                </td>
            </tr>
        `;
        return;
    }

    tableBody.innerHTML = successfulModels.map(
        (model, index) => `
            <tr>
                <td style="padding: 8px;">
                    ${index + 1}
                </td>
                <td style="padding: 8px;">
                    ${escapeHtml(model.name || model.id || "?")}
                </td>
                <td style="padding: 8px;">
                    ${escapeHtml(model.provider || "?")}
                </td>
            </tr>
        `
    ).join("");
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

</script>
</body>
</html>
