<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCode Gateway</title>
  <style>
    body {
      margin: 0;
      background: #f3f5f9;
      color: #202938;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }
    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 12px 0;
      border-radius: 14px;
      box-shadow: 0 4px 18px #1720330c;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }
    .count {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0;
    }
    .muted {
      color: #64748b;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .message {
      min-height: 24px;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main>
  <h1>MyCode Gateway</h1>
  <p>پنل مدیریت اتصال به مدل‌های هوش مصنوعی</p>

  <section class="card">
    <span class="badge">سرویس فعال است</span>
    <h2>ارائه‌دهندگان مدل</h2>
    <p id="status">در حال دریافت اطلاعات...</p>
    <div class="providers" id="providers"></div>
  </section>

  <section class="card">
    <h2>مسیریابی مدل‌ها</h2>
    <p>مدل اصلی: هنوز انتخاب نشده</p>
    <p>مدل‌های پشتیبان: ۰ از ۳</p>
    <p class="muted">
      انتخاب مدل اصلی و پشتیبان را در مرحله بعد اضافه می‌کنیم.
    </p>
  </section>
</main>

<script>
const providerNames = {
  nvidia: "NVIDIA NIM",
  openrouter: "OpenRouter",
  token_router: "Token Router"
};

async function loadProviders() {
  const status = document.getElementById("status");
  const container = document.getElementById("providers");

  try {
    const response = await fetch("/api/providers");
    if (!response.ok) throw new Error("HTTP " + response.status);

    const providers = await response.json();
    container.replaceChildren();

    for (const [key, provider] of Object.entries(providers)) {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = providerNames[key] || key;

      const state = document.createElement("p");
      state.textContent = provider.enabled ? "فعال" : "غیرفعال";

      const count = document.createElement("div");
      count.className = "count";
      count.textContent = provider.model_count ?? 0;

      const label = document.createElement("p");
      label.textContent = "مدل ثبت‌شده";

      const button = document.createElement("button");
      button.textContent = "دریافت مدل‌ها";

      const message = document.createElement("div");
      message.className = "message muted";

      button.addEventListener("click", async () => {
        button.disabled = true;
        message.textContent = "در حال دریافت فهرست مدل‌ها...";

        try {
          const result = await fetch(
            `/api/providers/${encodeURIComponent(key)}/refresh-models`,
            { method: "POST" }
          );

          const data = await result.json();

          if (!result.ok) {
            throw new Error(data.detail || "خطای نامشخص");
          }

          count.textContent = data.model_count;
          state.textContent = "فعال";
          message.textContent =
            `${data.model_count} مدل با موفقیت دریافت شد.`;
        } catch (error) {
          message.textContent = "خطا: " + error.message;
        } finally {
          button.disabled = false;
        }
      });

      card.append(title, state, count, label, button, message);
      container.appendChild(card);
    }

    status.textContent = "اطلاعات با موفقیت دریافت شد.";
  } catch (error) {
    status.textContent = "دریافت اطلاعات ناموفق بود: " + error.message;
  }
}

loadProviders();
</script>
</body>
</html>
