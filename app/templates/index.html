<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCode Gateway</title>
  <style>
    body {
      margin: 0;
      background: #f3f5f9;
      color: #202938;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
    }
    .providers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      padding: 22px;
      margin: 12px 0;
      border-radius: 14px;
      box-shadow: 0 4px 18px #1720330c;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }
    .count {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0;
    }
    .muted {
      color: #64748b;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .message {
      min-height: 24px;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<main>
  <h1>MyCode Gateway</h1>
  <p>پنل مدیریت اتصال به مدل‌های هوش مصنوعی</p>

  <section class="card">
    <span class="badge">سرویس فعال است</span>
    <h2>ارائه‌دهندگان مدل</h2>
    <p id="status">در حال دریافت اطلاعات...</p>
    <div class="providers" id="providers"></div>
  </section>

  <section class="card">

    <h2>مدل‌ها</h2>

    <p id="rotation-round">
        شماره دور: —
    </p>

    <p id="rotation-count">
        تعداد مدل‌های باقی‌مانده: —
    </p>

    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="text-align: left; padding: 8px;">Row</th>
                    <th style="text-align: left; padding: 8px;">Model Name</th>
                    <th style="text-align: left; padding: 8px;">Interface</th>
                </tr>
            </thead>

            <tbody id="rotation-models-body">
                <tr>
                    <td colspan="3" style="padding: 8px;">
                        در حال بارگذاری مدل‌ها...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

  </section>



</main>



<script>
"use strict";

const providerNames = {
    nvidia: "NVIDIA NIM",
    openrouter: "OpenRouter",
    token_router: "Token Router"
};

/*
 * فهرست مدل‌هایی که از دفتر مدل‌ها دریافت می‌شود.
 */
let largeCatalogModels = [];


/* =========================================================
   1. ارائه‌دهندگان مدل
   ========================================================= */

async function loadProviders() {
    const statusElement = document.getElementById("status");
    const container = document.getElementById("providers");

    try {
        const response = await fetch("/api/providers");

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const providers = await response.json();

        container.replaceChildren();

        for (const [key, provider] of Object.entries(providers)) {
            const card = document.createElement("div");
            card.className = "card";

            const title = document.createElement("h3");
            title.textContent = providerNames[key] || key;

            const state = document.createElement("p");
            state.textContent = provider.enabled ? "فعال" : "غیرفعال";

            const count = document.createElement("div");
            count.className = "count";
            count.textContent = provider.model_count ?? 0;

            const label = document.createElement("p");
            label.textContent = "مدل ثبت‌شده";

            const button = document.createElement("button");
            button.textContent = "دریافت مدل‌ها";

            const message = document.createElement("div");
            message.className = "message muted";

            button.addEventListener("click", async () => {
                button.disabled = true;
                message.textContent = "در حال دریافت فهرست مدل‌ها...";

                try {
                    const result = await fetch(
                        `/api/providers/${encodeURIComponent(key)}/refresh-models`,
                        { method: "POST" }
                    );

                    const data = await result.json();

                    if (!result.ok) {
                        throw new Error(data.detail || "خطای نامشخص");
                    }

                    count.textContent = data.model_count ?? 0;
                    state.textContent = "فعال";

                    message.textContent =
                        `${data.model_count} مدل با موفقیت دریافت شد.`;

                    // پس از به‌روزرسانی ارائه‌دهنده، جدول را هم تازه کن.
                    await loadLargeCatalog();

                } catch (error) {
                    message.textContent = "خطا: " + error.message;
                } finally {
                    button.disabled = false;
                }
            });

            card.append(title, state, count, label, button, message);
            container.appendChild(card);
        }

        statusElement.textContent = "اطلاعات با موفقیت دریافت شد.";

    } catch (error) {
        statusElement.textContent =
            "دریافت اطلاعات ناموفق بود: " + error.message;
    }
}


/* =========================================================
   2. دریافت فهرست مدل‌ها
   ========================================================= */

async function loadLargeCatalog() {
    const tableBody = document.getElementById("rotation-models-body");

    try {
        const response = await fetch("/api/thinker-room/catalog");

        if (!response.ok) {
            throw new Error("خطا در دریافت فهرست مدل‌ها: HTTP " + response.status);
        }

        const catalog = await response.json();

        largeCatalogModels = Array.isArray(catalog.models)
            ? catalog.models
            : [];

        renderRotationPanel();

    } catch (error) {
        console.error("خطا در دریافت فهرست مدل‌ها:", error);

        if (tableBody) {
            tableBody.replaceChildren();

            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 3;
            cell.style.padding = "8px";
            cell.textContent =
                "دریافت فهرست مدل‌ها ناموفق بود: " + error.message;

            row.appendChild(cell);
            tableBody.appendChild(row);
        }
    }
}


/* =========================================================
   3. تعیین وضعیت مدل
   ========================================================= */

function getModelStatus(model) {
    const current = model.test_status ?? "untested";

    // مدل ناموفق هیچ‌گاه در فهرست موفق‌ها قرار نمی‌گیرد.
    if (current === "failed") {
        return "failed";
    }

    // همان معیار موفقیت توافق‌شده:
    // وضعیت tested یا داشتن lifetime_chars غیر null.
    if (
        current === "tested" ||
        model.lifetime_chars != null
    ) {
        return "tested";
    }

    if (current === "in_progress") {
        return "in_progress";
    }

    return "untested";
}


/* =========================================================
   4. نمایش جدول مدل‌ها
   ========================================================= */

function renderRotationPanel() {
    const roundElement =
        document.getElementById("rotation-round");

    const countElement =
        document.getElementById("rotation-count");

    const tableBody =
        document.getElementById("rotation-models-body");

    if (!roundElement || !countElement || !tableBody) {
        console.error("عناصر جدول مدل‌ها در HTML پیدا نشدند.");
        return;
    }

    // همه مدل‌های موفق؛ بدون محدودیت تعداد ردیف.
    const successfulModels = largeCatalogModels.filter(
        model => getModelStatus(model) === "tested"
    );

    // تعداد مدل‌هایی که هنوز آزمایش نشده‌اند.
    const remainingCount = largeCatalogModels.filter(
        model => getModelStatus(model) === "untested"
    ).length;

    // شماره دور از داده‌های فعلی قابل تعیین نیست.
    roundElement.textContent = "شماره دور: —";

    countElement.textContent =
        "تعداد مدل‌های باقی‌مانده: " +
        remainingCount.toLocaleString("fa-IR");

    tableBody.replaceChildren();

    if (successfulModels.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 3;
        cell.style.padding = "8px";
        cell.textContent = "هنوز مدل موفقی ثبت نشده است.";

        row.appendChild(cell);
        tableBody.appendChild(row);
        return;
    }

    const fragment = document.createDocumentFragment();

    successfulModels.forEach((model, index) => {
        const row = document.createElement("tr");

        const rowNumber = document.createElement("td");
        rowNumber.style.padding = "8px";
        rowNumber.textContent = (index + 1).toLocaleString("fa-IR");

        const modelName = document.createElement("td");
        modelName.style.padding = "8px";
        modelName.style.overflowWrap = "anywhere";
        modelName.textContent = model.name || model.id || "بدون نام";

        const interfaceName = document.createElement("td");
        interfaceName.style.padding = "8px";
        interfaceName.textContent =
            providerNames[model.provider] || model.provider || "نامشخص";

        row.append(rowNumber, modelName, interfaceName);
        fragment.appendChild(row);
    });

    tableBody.appendChild(fragment);
}


/* =========================================================
   5. راه‌اندازی صفحه
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {
    loadProviders();
    loadLargeCatalog();
});
</script>

</body>
</html>
